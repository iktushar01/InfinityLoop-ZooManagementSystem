<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Animal | Infinity Loop Zoo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="animals">
  <div class="app-layout">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="navbar-container"></div>
      <main class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Add New Animal</h1>
            <p class="page-subtitle">Register a new animal in the zoo</p>
          </div>
          <a href="animals.html" class="btn btn-secondary">
            <i class="fa-solid fa-arrow-left"></i> Back
          </a>
        </div>

        <div class="glass-card" style="max-width:720px">
          <form id="add-animal-form">
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">Name <span class="required">*</span></label>
                <input type="text" name="name" class="form-input" data-required placeholder="e.g. Simba" />
                <div class="form-error"></div>
              </div>
              <div class="form-group">
                <label class="form-label">Species <span class="required">*</span></label>
                <input type="text" name="species" class="form-input" data-required placeholder="e.g. Lion" />
                <div class="form-error"></div>
              </div>
              <div class="form-group">
                <label class="form-label">Age <span class="required">*</span></label>
                <input type="number" name="age" class="form-input" data-required min="0" placeholder="Years" />
                <div class="form-error"></div>
              </div>
              <div class="form-group">
                <label class="form-label">Gender <span class="required">*</span></label>
                <select name="gender" class="form-select" data-required>
                  <option value="">Select gender</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>
                <div class="form-error"></div>
              </div>
              <div class="form-group">
                <label class="form-label">Weight (kg) <span class="required">*</span></label>
                <input type="number" name="weight" class="form-input" data-required min="0.1" step="0.1" placeholder="kg" />
                <div class="form-error"></div>
              </div>
              <div class="form-group">
                <label class="form-label">Animal Type <span class="required">*</span></label>
                <select name="animalType" id="animal-type" class="form-select" data-required>
                  <option value="">Select type</option>
                  <option value="Mammal">Mammal</option>
                  <option value="Bird">Bird</option>
                  <option value="Reptile">Reptile</option>
                  <option value="Fish">Fish</option>
                </select>
                <div class="form-error"></div>
              </div>
            </div>

            <!-- Mammal-specific fields -->
            <div id="mammal-fields" class="form-grid" style="display:none">
              <div class="form-group">
                <label class="form-label">Fur Color</label>
                <input type="text" name="furColor" class="form-input" placeholder="e.g. Golden" />
              </div>
              <div class="form-group">
                <label class="form-label">Carnivore</label>
                <select name="isCarnivore" class="form-select">
                  <option value="true">Yes</option>
                  <option value="false">No</option>
                </select>
              </div>
            </div>

            <!-- Bird-specific fields -->
            <div id="bird-fields" class="form-grid" style="display:none">
              <div class="form-group">
                <label class="form-label">Wing Span (m)</label>
                <input type="number" name="wingSpan" class="form-input" min="0" step="0.1" placeholder="meters" />
              </div>
              <div class="form-group">
                <label class="form-label">Can Fly</label>
                <select name="canFly" class="form-select">
                  <option value="true">Yes</option>
                  <option value="false">No</option>
                </select>
              </div>
            </div>

            <div class="form-actions">
              <button type="button" class="btn btn-secondary" onclick="location.href='animals.html'">Cancel</button>
              <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-plus"></i> Add Animal
              </button>
            </div>
          </form>
        </div>
      </main>
      <footer class="app-footer">&copy; 2026 Infinity Loop Zoo Management System. All rights reserved.</footer>
    </div>
  </div>
  <div id="modal-container"></div>
  <div class="toast-container" id="toast-mount"></div>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/animals.js"></script>
</body>
</html>
