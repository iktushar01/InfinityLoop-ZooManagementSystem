<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keepers</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Keepers</h1>
    <nav><a href="index.html">Home</a><a href="animals.html">Animals</a><a href="tickets.html">Tickets</a><a href="reports.html">Reports</a></nav>
  </header>
  <main class="grid">
    <section>
      <h2>Add Keeper</h2>
      <form id="keeperForm">
        <label>Name <input name="name" required></label>
        <label>Age <input name="age" type="number" min="18" required></label>
        <label>Phone <input name="phone"></label>
        <label>Email <input name="email" type="email"></label>
        <button type="submit">Save Keeper</button>
      </form>
      <p id="keeperMessage" class="message"></p>
    </section>
    <section>
      <h2>Keeper List</h2>
      <table><thead><tr><th>Name</th><th>Email</th><th>Assigned Animals</th></tr></thead><tbody id="keeperRows"></tbody></table>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/keepers.js"></script>
</body>
</html>
