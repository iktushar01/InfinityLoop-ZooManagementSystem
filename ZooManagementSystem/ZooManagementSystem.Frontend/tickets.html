<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tickets</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Tickets</h1>
    <nav><a href="index.html">Home</a><a href="animals.html">Animals</a><a href="keepers.html">Keepers</a><a href="reports.html">Reports</a></nav>
  </header>
  <main class="grid">
    <section>
      <h2>Sell Ticket</h2>
      <form id="ticketForm">
        <label>Visitor Name <input name="visitorName" required></label>
        <label>Ticket Type <select name="ticketType"><option>Adult</option><option>Child</option><option>VIP</option></select></label>
        <label>Price <input name="price" type="number" min="0" step="0.01" required></label>
        <label>Visit Date <input name="visitDate" type="date" required></label>
        <button type="submit">Save Ticket</button>
      </form>
      <p id="ticketMessage" class="message"></p>
    </section>
    <section>
      <h2>Ticket List</h2>
      <table><thead><tr><th>Visitor</th><th>Type</th><th>Price</th><th>Date</th></tr></thead><tbody id="ticketRows"></tbody></table>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/tickets.js"></script>
</body>
</html>
