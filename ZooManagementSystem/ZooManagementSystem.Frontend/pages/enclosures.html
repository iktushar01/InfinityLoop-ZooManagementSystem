<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enclosures | Infinity Loop Zoo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="enclosures">
  <div class="app-layout">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="navbar-container"></div>
      <main class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Enclosure Management</h1>
            <p class="page-subtitle">Manage habitats and animal housing</p>
          </div>
          <button class="btn btn-primary" id="add-enclosure-btn">
            <i class="fa-solid fa-plus"></i> Add Enclosure
          </button>
        </div>

        <div class="glass-card">
          <div class="table-container">
            <table class="data-table" id="enclosures-table">
              <thead>
                <tr>
                  <th data-sort="name">Name</th>
                  <th data-sort="habitat">Habitat Type</th>
                  <th data-sort="capacity">Capacity</th>
                  <th>Current Animals</th>
                  <th>Available Space</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="enclosures-tbody">
                <tr><td colspan="7" class="loading-inline"><div class="spinner"></div> Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
      <footer class="app-footer">&copy; 2026 Infinity Loop Zoo Management System. All rights reserved.</footer>
    </div>
  </div>
  <div id="modal-container"></div>
  <div class="toast-container" id="toast-mount"></div>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/enclosures.js"></script>
</body>
</html>
