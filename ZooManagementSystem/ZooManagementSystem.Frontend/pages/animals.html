<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animals | Infinity Loop Zoo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="animals">
  <div class="app-layout">
    <div id="sidebar-container"></div>
    <div class="main-content">
      <div id="navbar-container"></div>
      <main class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Animal Management</h1>
            <p class="page-subtitle">Manage all zoo animals and their assignments</p>
          </div>
          <a href="add-animal" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i> Add Animal
          </a>
        </div>

        <div class="filters-bar">
          <select id="filter-type" class="filter-select">
            <option value="">All Types</option>
            <option value="Mammal">Mammal</option>
            <option value="Bird">Bird</option>
            <option value="Reptile">Reptile</option>
            <option value="Fish">Fish</option>
          </select>
          <select id="filter-health" class="filter-select">
            <option value="">All Health Status</option>
            <option value="Healthy">Healthy</option>
            <option value="Sick">Sick</option>
            <option value="Critical">Critical</option>
          </select>
        </div>

        <div class="glass-card">
          <div class="table-container">
            <table class="data-table" id="animals-table">
              <thead>
                <tr>
                  <th data-sort="name">Name <i class="fa-solid fa-sort sort-icon"></i></th>
                  <th data-sort="species">Species <i class="fa-solid fa-sort sort-icon"></i></th>
                  <th data-sort="type">Type <i class="fa-solid fa-sort sort-icon"></i></th>
                  <th data-sort="age">Age <i class="fa-solid fa-sort sort-icon"></i></th>
                  <th data-sort="gender">Gender</th>
                  <th data-sort="health">Health Status</th>
                  <th data-sort="weight">Weight (kg)</th>
                  <th>Enclosure</th>
                  <th>Keeper</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="animals-tbody">
                <tr><td colspan="10" class="loading-inline"><div class="spinner"></div> Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
      <footer class="app-footer">&copy; 2026 Infinity Loop Zoo Management System. All rights reserved.</footer>
    </div>
  </div>
  <div id="modal-container"></div>
  <div class="toast-container" id="toast-mount"></div>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/animals.js"></script>
</body>
</html>
