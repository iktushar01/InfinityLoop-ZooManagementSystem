<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Animal | Zoo Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              forest: {
                50: '#f1f9f3',
                100: '#dcefe0',
                200: '#bbe0c1',
                300: '#8ec69f',
                400: '#5ea77c',
                500: '#3c875d',
                600: '#2d6947',
                700: '#234f38',
                800: '#173d2d',
                900: '#102b22'
              }
            }
          }
        }
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-icon"><i class="fa-solid fa-hippo"></i></div>
          <div>
            <div class="brand-name">Infinity Loop</div>
            <small>Zoo Management</small>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a class="nav-item" href="../index.html"><i class="fa-solid fa-table-columns"></i><span>Dashboard</span></a>
          <a class="nav-item active" href="animals.html"><i class="fa-solid fa-paw"></i><span>Animals</span></a>
          <a class="nav-item" href="keepers.html"><i class="fa-solid fa-user-tie"></i><span>Keepers</span></a>
          <a class="nav-item" href="enclosures.html"><i class="fa-solid fa-landmark"></i><span>Enclosures</span></a>
          <a class="nav-item" href="feeding.html"><i class="fa-solid fa-utensils"></i><span>Feeding Schedule</span></a>
          <a class="nav-item" href="health.html"><i class="fa-solid fa-heart-pulse"></i><span>Health Records</span></a>
          <a class="nav-item" href="tickets.html"><i class="fa-solid fa-ticket"></i><span>Tickets</span></a>
          <a class="nav-item" href="reports.html"><i class="fa-solid fa-chart-column"></i><span>Reports</span></a>
        </nav>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div class="search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search animals, keepers, tickets..." />
          </div>
          <div class="topbar-actions">
            <button class="icon-button" aria-label="Notifications"><i class="fa-solid fa-bell"></i><span class="alert-dot"></span></button>
            <div class="profile-pill">
              <div class="profile-avatar">IL</div>
              <div>
                <strong>Infinity Loop</strong>
                <small>Admin</small>
              </div>
            </div>
          </div>
        </header>

        <main class="content-area">
          <div class="page-header">
            <div>
              <p class="eyebrow">Animal management</p>
              <h1>Add new animal</h1>
            </div>
            <a href="animals.html" class="secondary-button"><i class="fa-solid fa-arrow-left"></i> Back to animals</a>
          </div>

          <section class="panel-card">
            <form id="animalForm" class="form-grid">
              <div class="field-group">
                <label>Name</label>
                <input type="text" name="name" required />
              </div>
              <div class="field-group">
                <label>Species</label>
                <input type="text" name="species" required />
              </div>
              <div class="field-group">
                <label>Age</label>
                <input type="number" name="age" min="0" required />
              </div>
              <div class="field-group">
                <label>Gender</label>
                <select name="gender">
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Unknown">Unknown</option>
                </select>
              </div>
              <div class="field-group">
                <label>Weight (kg)</label>
                <input type="number" name="weight" min="0.1" step="0.1" required />
              </div>
              <div class="field-group">
                <label>Animal type</label>
                <select name="animalType">
                  <option value="Mammal">Mammal</option>
                  <option value="Bird">Bird</option>
                  <option value="Reptile">Reptile</option>
                  <option value="Aquatic">Aquatic</option>
                  <option value="Amphibian">Amphibian</option>
                </select>
              </div>
              <div class="field-group">
                <label>Fur color</label>
                <input type="text" name="furColor" />
              </div>
              <div class="field-group">
                <label>Is carnivore</label>
                <select name="isCarnivore">
                  <option value="true">Yes</option>
                  <option value="false">No</option>
                </select>
              </div>
              <div class="field-group">
                <label>Wing span (m)</label>
                <input type="number" name="wingSpan" min="0" step="0.1" />
              </div>
              <div class="field-group">
                <label>Can fly</label>
                <select name="canFly">
                  <option value="true">Yes</option>
                  <option value="false">No</option>
                </select>
              </div>

              <div class="form-actions full-width">
                <button type="submit" class="primary-button"><i class="fa-solid fa-floppy-disk"></i> Save animal</button>
                <button type="reset" class="secondary-button"><i class="fa-solid fa-rotate-left"></i> Reset</button>
              </div>
            </form>
          </section>
        </main>
      </div>
    </div>

    <div class="loading-overlay" id="globalLoader" aria-live="polite">
      <div class="loader-ring"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="../js/api.js"></script>
    <script src="../js/animals.js"></script>
  </body>
</html>
