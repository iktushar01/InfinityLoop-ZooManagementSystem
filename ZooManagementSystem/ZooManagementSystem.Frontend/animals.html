<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animals</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Animals</h1>
    <nav><a href="index.html">Home</a><a href="keepers.html">Keepers</a><a href="tickets.html">Tickets</a><a href="reports.html">Reports</a></nav>
  </header>
  <main class="grid">
    <section>
      <h2>Add Animal</h2>
      <form id="animalForm">
        <label>Name <input name="name" required></label>
        <label>Species <input name="species" required></label>
        <label>Age <input name="age" type="number" min="0" required></label>
        <label>Gender <select name="gender"><option>Male</option><option>Female</option></select></label>
        <label>Weight <input name="weight" type="number" min="0.1" step="0.1" required></label>
        <label>Type <select name="animalType"><option>Mammal</option><option>Bird</option></select></label>
        <label>Fur Color <input name="furColor"></label>
        <label>Is Carnivore <select name="isCarnivore"><option value="false">No</option><option value="true">Yes</option></select></label>
        <label>Wing Span <input name="wingSpan" type="number" min="0" step="0.1"></label>
        <label>Can Fly <select name="canFly"><option value="true">Yes</option><option value="false">No</option></select></label>
        <button type="submit">Save Animal</button>
      </form>
      <p id="animalMessage" class="message"></p>
    </section>
    <section>
      <h2>Animal List</h2>
      <table><thead><tr><th>Name</th><th>Type</th><th>Health</th><th>Food/day</th></tr></thead><tbody id="animalRows"></tbody></table>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/animals.js"></script>
</body>
</html>
