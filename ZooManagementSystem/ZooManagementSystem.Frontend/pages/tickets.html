<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tickets | Zoo Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{forest:{50:'#f1f9f3',100:'#dcefe0',200:'#bbe0c1',300:'#8ec69f',400:'#5ea77c',500:'#3c875d',600:'#2d6947',700:'#234f38',800:'#173d2d',900:'#102b22'}}}}};</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-icon"><i class="fa-solid fa-hippo"></i></div>
          <div>
            <div class="brand-name">Infinity Loop</div>
            <small>Zoo Management</small>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a class="nav-item" href="../index.html"><i class="fa-solid fa-table-columns"></i><span>Dashboard</span></a>
          <a class="nav-item" href="animals.html"><i class="fa-solid fa-paw"></i><span>Animals</span></a>
          <a class="nav-item" href="keepers.html"><i class="fa-solid fa-user-tie"></i><span>Keepers</span></a>
          <a class="nav-item" href="enclosures.html"><i class="fa-solid fa-landmark"></i><span>Enclosures</span></a>
          <a class="nav-item" href="feeding.html"><i class="fa-solid fa-utensils"></i><span>Feeding Schedule</span></a>
          <a class="nav-item" href="health.html"><i class="fa-solid fa-heart-pulse"></i><span>Health Records</span></a>
          <a class="nav-item active" href="tickets.html"><i class="fa-solid fa-ticket"></i><span>Tickets</span></a>
          <a class="nav-item" href="reports.html"><i class="fa-solid fa-chart-column"></i><span>Reports</span></a>
        </nav>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div class="search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="ticketSearch" type="text" placeholder="Search visitors or ticket types" />
          </div>
          <div class="topbar-actions">
            <button class="icon-button" aria-label="Notifications"><i class="fa-solid fa-bell"></i><span class="alert-dot"></span></button>
            <div class="profile-pill"><div class="profile-avatar">IL</div><div><strong>Infinity Loop</strong><small>Admin</small></div></div>
          </div>
        </header>

        <main class="content-area">
          <div class="page-header">
            <div>
              <p class="eyebrow">Visitor management</p>
              <h1>Tickets</h1>
            </div>
          </div>

          <section class="split-layout">
            <article class="panel-card form-card">
              <div class="section-header"><h3 id="ticketFormTitle">Add ticket</h3></div>
              <form id="ticketForm" class="form-grid compact-form">
                <div class="field-group">
                  <label>Visitor name</label>
                  <input type="text" name="visitorName" required />
                </div>
                <div class="field-group">
                  <label>Ticket type</label>
                  <select name="ticketType">
                    <option value="Adult">Adult</option>
                    <option value="Child">Child</option>
                    <option value="VIP">VIP</option>
                  </select>
                </div>
                <div class="field-group">
                  <label>Price</label>
                  <input type="number" name="price" min="0" step="0.01" required />
                </div>
                <div class="field-group">
                  <label>Visit date</label>
                  <input type="date" name="visitDate" required />
                </div>
                <div class="form-actions full-width">
                  <button type="submit" class="primary-button"><i class="fa-solid fa-ticket"></i> Save ticket</button>
                  <button type="button" id="cancelTicketEdit" class="secondary-button hidden"><i class="fa-solid fa-xmark"></i> Cancel</button>
                </div>
              </form>
            </article>

            <article class="panel-card">
              <div class="table-wrap">
                <table class="data-table">
                  <thead>
                    <tr><th>Visitor</th><th>Ticket Type</th><th>Price</th><th>Date</th><th>Actions</th></tr>
                  </thead>
                  <tbody id="ticketsTableBody"></tbody>
                </table>
              </div>
              <div id="ticketsEmptyState" class="empty-state hidden">
                <i class="fa-solid fa-ticket"></i>
                <h3>No tickets found</h3>
                <p>Visitor ticket activity will appear here.</p>
              </div>
            </article>
          </section>
        </main>
      </div>
    </div>

    <div class="loading-overlay" id="globalLoader" aria-live="polite"><div class="loader-ring"></div></div>
    <div class="toast-container" id="toastContainer"></div>

    <script src="../js/api.js"></script>
    <script src="../js/tickets.js"></script>
  </body>
</html>
